name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: TypeScript build
        run: npm run build

      - name: Operational script syntax
        run: |
          node --check scripts/customer-sync-v2-shadow.mjs
          bash -n scripts/run-customer-sync-v2-shadow.sh
          bash -n scripts/install-customer-sync-v2-shadow-timer.sh
          sudo install -m 0700 scripts/customer-sync-v2-shadow.mjs /root/xpayments-customer-sync-v2-shadow.mjs
          sudo install -m 0700 scripts/run-customer-sync-v2-shadow.sh /root/run-customer-sync-v2-shadow.sh
          systemd-analyze verify \
            scripts/systemd/xpayments-customer-sync-v2-shadow.service \
            scripts/systemd/xpayments-customer-sync-v2-shadow.timer

      - name: Docker build
        run: docker build -t xpayments-backend:ci .
