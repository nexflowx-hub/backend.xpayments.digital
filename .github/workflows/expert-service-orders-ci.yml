name: Expert Service Orders CI

on:
  push:
    branches:
      - feat/xpay-expert-service-orders-20260908
      - feat/xpay-expert-payment-instructions-20260908
      - feat/expert-ops-v1-20260908
      - feat/control-plane-v1-20260908
      - feat/control-plane-v2-live-ops-20260909
      - fix/checkout-signed-reconcile-20260907
  pull_request:
    branches:
      - fix/checkout-signed-reconcile-20260907

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check scripts/control-plane-v2-e2e.js
